name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Sparrow.slnx

      - name: Build (Release)
        run: dotnet build Sparrow.slnx -c Release --no-restore

      - name: Test (Release)
        run: dotnet test tests/Sparrow.Tests/Sparrow.Tests.csproj -c Release --no-build

      # 漏洞审计依赖 NuGet 服务索引；网络抖动不应把构建判红。
      - name: NuGet vulnerability audit
        continue-on-error: true
        run: dotnet list src/Sparrow.App/Sparrow.App.csproj package --vulnerable --include-transitive
